# Example inventory: update host addresses and service ports for your environment.

define host {
    use             linux-server
    host_name       omdb01
    alias           MariaDB Server
    address         10.10.10.70
}

define host {
    use             linux-server
    host_name       ommc01
    alias           Memcached Server
    address         10.10.10.71
}

define host {
    use             linux-server
    host_name       omrmq01
    alias           RabbitMQ Server
    address         10.10.10.72
}

define host {
    use             linux-server
    host_name       omapp01
    alias           Tomcat Application Server
    address         10.10.10.73
}

define host {
    use             linux-server
    host_name       omweb01
    alias           Nginx Web Server
    address         10.10.10.74
}

# Common checks: ping, SSH, CPU load, disk, memory, process count.
# CPU/disk/memory/process checks require matching commands in the remote NRPE config.

define service {
    use                     generic-service
    host_name               omdb01,ommc01,omrmq01,omapp01,omweb01
    service_description     PING
    check_command           vp_ping
}

define service {
    use                     generic-service
    host_name               omdb01,ommc01,omrmq01,omapp01,omweb01
    service_description     SSH
    check_command           vp_ssh
}

define service {
    use                     generic-service
    host_name               omdb01,ommc01,omrmq01,omapp01,omweb01
    service_description     CPU Load
    check_command           vp_nrpe!check_load
}

define service {
    use                     generic-service
    host_name               omdb01,ommc01,omrmq01,omapp01,omweb01
    service_description     Root Disk Usage
    check_command           vp_nrpe!check_disk
}

define service {
    use                     generic-service
    host_name               omdb01,ommc01,omrmq01,omapp01,omweb01
    service_description     Memory Usage
    check_command           vp_nrpe!check_mem
}

define service {
    use                     generic-service
    host_name               omdb01,ommc01,omrmq01,omapp01,omweb01
    service_description     Process Count
    check_command           vp_nrpe!check_procs
}

# Application-specific checks.
define service {
    use                     generic-service
    host_name               omdb01
    service_description     MariaDB Port 3306
    check_command           vp_tcp!3306
}

define service {
    use                     generic-service
    host_name               ommc01
    service_description     Memcached Port 11211
    check_command           vp_tcp!11211
}

define service {
    use                     generic-service
    host_name               omrmq01
    service_description     RabbitMQ Port 5672
    check_command           vp_tcp!5672
}

define service {
    use                     generic-service
    host_name               omapp01
    service_description     Tomcat HTTP 8080
    check_command           vp_http!8080
}

define service {
    use                     generic-service
    host_name               omweb01
    service_description     Nginx HTTP 80
    check_command           vp_http!80
}
