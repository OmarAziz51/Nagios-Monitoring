# Place in /usr/local/nagios/etc/objects/ or an included config directory.
# Ensure the directory containing this file is included from nagios.cfg.

define command {
    command_name    vp_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 100.0,20% -c 500.0,60% -p 5
}

define command {
    command_name    vp_ssh
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p 22 -w 5 -c 10
}

define command {
    command_name    vp_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w 5 -c 10
}

define command {
    command_name    vp_http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -w 5 -c 10
}

define command {
    command_name    vp_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -t 15 -c $ARG1$
}
